#
# Publishes site/ (the watch and download pages behind share links and Pass
# It Along; docs/share-links.md) to GitHub Pages, at
# https://dougtrier.github.io/GenX-Streamer/, whenever main changes it.
# Settings → Pages → Source must be "GitHub Actions".
name: Publish the website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
