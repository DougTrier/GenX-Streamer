#
# Publishes site/ (the watch and download pages behind share links and Pass
# It Along; docs/share-links.md) to GitHub Pages, at
# https://dougtrier.github.io/GenX-Streamer/, whenever main changes it.
# Settings → Pages → Source must be "GitHub Actions".
name: Publish the website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the 0.1.33 download mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release browser URLs return 504, but the release asset API works.
          mirror=site/downloads/v0.1.33
          mkdir -p "$mirror"
          gh release download v0.1.33 --dir "$mirror" \
            --pattern 'GenX-Streamer-0.1.33-Windows-x64.exe' \
            --pattern 'GenX-Streamer-0.1.33-Windows-x64-portable.zip' \
            --pattern 'GenX-Streamer-0.1.33-Android.apk' \
            --pattern SHA256SUMS
          cd "$mirror"
          echo '6eb9cea781bf7628555cc2d553a0e675fe112b32689939737267af22b42af56f  SHA256SUMS' | sha256sum --check
          sha256sum --check SHA256SUMS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
