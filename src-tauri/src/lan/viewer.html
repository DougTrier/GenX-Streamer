<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenX Streamer</title><link rel="stylesheet" href="/viewer.css"></head><body><main><header><span aria-hidden="true">▣</span><div><h1>GenX Streamer</h1><p>Connect to your television session</p></div></header><form id="pair"><label for="secret">Invitation code</label><input id="secret" type="password" required autocomplete="off" maxlength="64"><button>Connect securely</button></form><p id="status" role="status">Ask the host for a viewing invitation.</p><section id="view" hidden><video id="video" controls playsinline preload="none"></video><button id="watch">Watch this channel</button><p>Your pause affects only this device.</p></section><form id="control" hidden><label for="search">Find a channel</label><input id="search" type="search" autocomplete="off" placeholder="Search channel names"><label for="channel">Channels</label><select id="channel" required size="5"></select><p id="matches" aria-live="polite"></p><button>Change host channel</button><div class="remote"><button type="button" data-action="previous">Previous</button><button type="button" data-action="next">Next</button><button type="button" data-action="pause">Pause</button><button type="button" data-action="resume">Resume</button><button type="button" data-action="mute" data-muted="true">Mute</button><button type="button" data-action="mute" data-muted="false">Unmute</button></div><label for="volume">Host volume</label><input id="volume" type="range" min="0" max="1" step="0.05" value="1"><p>Controller access is a separate invitation.</p></form></main><script src="/hls.js"></script><script src="/viewer.js"></script></body></html>
